name: AI Search Visibility Agent CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        env:
          AGENT_DB: sqlite
          AGENT_DB_PATH: ":memory:"
          AUTH_SECRET_KEY: test-secret
          AUTH_DEFAULT_USER: testadmin
          AUTH_DEFAULT_PASS: testpass123
        run: |
          pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - name: Lint
        run: |
          flake8 agent.py --max-line-length=120 --ignore=E501,W503,E722 || true

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ai-search-visibility:${{ github.sha }} .
          docker tag ai-search-visibility:${{ github.sha }} ai-search-visibility:latest

      - name: Test Docker image
        run: |
          docker run -d --name test-agent \
            -p 8000:8000 \
            -e AUTH_SECRET_KEY=test \
            -e AUTH_DEFAULT_USER=admin \
            -e AUTH_DEFAULT_PASS=test123 \
            ai-search-visibility:latest
          sleep 10
          curl -f http://localhost:8000/api/health || exit 1
          docker stop test-agent

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy notification
        run: echo "Ready to deploy ai-search-visibility:${{ github.sha }}"
