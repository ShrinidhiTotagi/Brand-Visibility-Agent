version: "3.8"

services:
  agent:
    build: .
    container_name: ai-search-visibility
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - AGENT_DB=sqlite
      - AGENT_DB_PATH=/app/data/agent_storage.db
    volumes:
      - agent-data:/app/data
      - agent-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

volumes:
  agent-data:
  agent-logs:
