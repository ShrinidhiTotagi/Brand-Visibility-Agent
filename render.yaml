# Render blueprint (FREE tier): full Python backend, ephemeral SQLite.
# Limits on free: no persistent disk (DB resets on restart/redeploy),
# sleeps after 15 min idle (scheduler pauses while asleep, ~60s cold start).
services:
  - type: web
    name: brand-visibility-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python agent.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
